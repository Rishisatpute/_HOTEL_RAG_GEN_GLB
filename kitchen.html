<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kitchen Display – Angaar Dhaba</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11">
  <link rel="icon" href="favicon.svg?v=11" type="image/svg+xml">
</head>
<body class="page-staff">
  <header class="staff-bar">
    <div class="staff-bar-inner">
      <a href="staff.html" class="staff-back" aria-label="Back to staff hub">←</a>
      <div class="staff-title">👨‍🍳 Kitchen Display</div>
      <div class="staff-clock" id="staffClock"></div>
    </div>
  </header>

  <main class="kds-board">
    <section class="kds-col" data-col="new">
      <h2 class="kds-col-title"><span class="dot-new"></span>New <span class="kds-count" id="countNew">0</span></h2>
      <div class="kds-cards" id="colNew"></div>
    </section>
    <section class="kds-col" data-col="preparing">
      <h2 class="kds-col-title"><span class="dot-preparing"></span>Preparing <span class="kds-count" id="countPreparing">0</span></h2>
      <div class="kds-cards" id="colPreparing"></div>
    </section>
    <section class="kds-col" data-col="ready">
      <h2 class="kds-col-title"><span class="dot-ready"></span>Ready for pickup <span class="kds-count" id="countReady">0</span></h2>
      <div class="kds-cards" id="colReady"></div>
    </section>
  </main>

  <p class="staff-sync-note">Live within this browser — keep Kitchen, Waiter and Counter open in separate tabs on this device.</p>

  <script src="common.js?v=11"></script>
  <script src="orders.js?v=11"></script>
  <script src="kitchen.js?v=11"></script>
</body>
</html>
