<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Waiter View – Ek Punjab</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="page-staff">
  <header class="staff-bar">
    <div class="staff-bar-inner">
      <a href="staff.html" class="staff-back" aria-label="Back to staff hub">←</a>
      <div class="staff-title">🧑‍🍳 Waiter View</div>
      <div class="staff-clock" id="staffClock"></div>
    </div>
  </header>

  <main class="waiter-board">
    <section class="waiter-section">
      <h2 class="waiter-section-title"><span class="dot-ready"></span>Ready to deliver <span class="kds-count" id="countReady">0</span></h2>
      <div class="waiter-cards" id="colReady"></div>
    </section>
    <section class="waiter-section">
      <h2 class="waiter-section-title"><span class="dot-bill"></span>Delivered — request payment <span class="kds-count" id="countDelivered">0</span></h2>
      <div class="waiter-cards" id="colDelivered"></div>
    </section>
    <section class="waiter-section cash-section full-row">
      <h2 class="waiter-section-title"><span class="dot-cash"></span>Cash collection needed <span class="kds-count" id="countCash">0</span></h2>
      <div class="waiter-cards" id="colCash"></div>
    </section>
  </main>

  <p class="staff-sync-note">Live within this browser — keep Kitchen, Waiter and Counter open in separate tabs on this device.</p>

  <script src="common.js?v=11"></script>
  <script src="orders.js?v=11"></script>
  <script src="waiter.js?v=11"></script>
</body>
</html>
