<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter & Billing | Savory Haus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/counter.css">
</head>
<body class="admin-app counter-app" data-socket-room="counter">
    <aside class="admin-sidebar" id="counterSidebar">
        <div class="sidebar-brand">
            <i class="fas fa-cash-register"></i>
            <div><span>SAVORY HAUS</span><small>Counter / Billing</small></div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-view="orders"><i class="fas fa-receipt"></i><span>Live Orders</span><span class="badge" id="liveBadge">0</span></a>
            <a href="#" class="nav-item" data-view="reservations"><i class="fas fa-calendar-check"></i><span>Reservations</span><span class="badge" id="reservationBadge">0</span></a>
            <a href="#" class="nav-item" data-view="unpaid"><i class="fas fa-clock"></i><span>Awaiting Payment</span></a>
            <a href="kitchen-dashboard.html" class="nav-item"><i class="fas fa-fire-burner"></i><span>Kitchen</span></a>
            <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Admin</span></a>
            <a href="restaurant-menu.html" class="nav-item"><i class="fas fa-utensils"></i><span>Menu</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="avatar">CB</div>
                <div><p>Counter Staff</p><small>Billing Station</small></div>
            </div>
        </div>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div class="topbar-left">
                <button class="topbar-btn sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <div>
                    <h1>Billing Counter</h1>
                    <p id="counterClock">—</p>
                </div>
            </div>
            <div class="topbar-right">
                <span class="live-badge" style="display:flex;align-items:center;gap:8px;padding:0.4rem 1rem;border-radius:999px;background:rgba(93,190,138,0.12);color:#5dbe8a;font-size:0.75rem"><span class="pulse" style="width:8px;height:8px;background:#5dbe8a;border-radius:50%"></span> Real-time</span>
                <button class="topbar-btn" id="refreshCounter" title="Refresh"><i class="fas fa-sync-alt"></i></button>
            </div>
        </header>

        <div class="dashboard-content counter-content">
            <div class="counter-stats">
                <div class="kpi-card"><div class="kpi-icon orders"><i class="fas fa-receipt"></i></div><div class="kpi-info"><h3>Active Bills</h3><p class="kpi-value" id="statActive">0</p></div></div>
                <div class="kpi-card"><div class="kpi-icon pending"><i class="fas fa-hourglass-half"></i></div><div class="kpi-info"><h3>Unpaid</h3><p class="kpi-value" id="statUnpaid">0</p></div></div>
                <div class="kpi-card"><div class="kpi-icon revenue"><i class="fas fa-euro-sign"></i></div><div class="kpi-info"><h3>Paid Today</h3><p class="kpi-value" id="statPaid">€0</p></div></div>
                <div class="kpi-card" id="kpiReservations"><div class="kpi-icon orders"><i class="fas fa-calendar-check"></i></div><div class="kpi-info"><h3>Reservations</h3><p class="kpi-value" id="statReservations">0</p></div></div>
            </div>

            <div class="counter-grid" id="counterGrid">
                <div class="loading-placeholder">Loading orders…</div>
            </div>
        </div>
    </div>

    <!-- Payment modal -->
    <div class="payment-modal-overlay" id="paymentOverlay">
        <div class="payment-modal">
            <button class="modal-close-btn" id="closePaymentModal">×</button>
            <h2>Process Payment</h2>
            <p class="payment-order-ref" id="paymentOrderRef"></p>
            <p class="payment-amount" id="paymentAmount"></p>
            <div class="payment-methods">
                <button class="pay-method" data-method="cash"><i class="fas fa-money-bill-wave"></i> Cash</button>
                <button class="pay-method" data-method="card"><i class="fas fa-credit-card"></i> Card</button>
                <button class="pay-method" data-method="upi"><i class="fas fa-mobile-alt"></i> UPI</button>
                <button class="pay-method" data-method="online"><i class="fas fa-globe"></i> Online</button>
            </div>
            <button class="btn-confirm-pay" id="confirmPayBtn" disabled>Select payment method</button>
        </div>
    </div>

    <!-- Bill print area (hidden) -->
    <div id="printArea" class="print-area"></div>

    <div class="toast" id="counterToast"></div>

    <script src="api.js"></script>
    <script src="js/socket-client.js"></script>
    <script src="counter-dashboard.js"></script>
</body>
</html>
