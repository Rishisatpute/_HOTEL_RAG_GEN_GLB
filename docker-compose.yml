services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: angaardhaba
      MYSQL_USER: angaardhaba
      MYSQL_PASSWORD: angaardhaba
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server-php/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql

  php:
    image: php:8.2-cli
    restart: unless-stopped
    working_dir: /app/server-php
    volumes:
      - .:/app
    command: >
      sh -c "docker-php-ext-install pdo pdo_mysql && php -S 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: php:8.2-cli
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: php -S 0.0.0.0:5000
    ports:
      - "5000:5000"

volumes:
  mysql_data:
