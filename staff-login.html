<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Staff Login – Angaar Dhaba</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=21">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="page-staff">
  <main class="staff-hub">
    <div class="staff-hub-brand">
      <div class="rule gold"></div>
      <div class="staff-hub-name">ANGAAR DHABA</div>
      <div class="staff-hub-sub">Staff access</div>
    </div>
    <form class="staff-login-card" id="staffLoginForm">
      <label for="staffPinInput" class="staff-login-label">Enter staff PIN</label>
      <input id="staffPinInput" class="modal-input" type="password" inputmode="text" autocomplete="off" autofocus>
      <p class="staff-login-error" id="staffLoginError" hidden></p>
      <button class="btn primary block" type="submit">Unlock</button>
    </form>
    <a class="staff-hub-home" href="index.html">← Back to customer site</a>
  </main>

  <script src="common.js?v=21"></script>
  <script src="orders.js?v=18"></script>
  <script src="staff-login.js?v=19"></script>
</body>
</html>
